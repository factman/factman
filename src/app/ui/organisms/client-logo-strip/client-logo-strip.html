@if (clients().length) {
  <section
    class="client-logo-strip"
    [class.is-paused]="paused()"
    aria-labelledby="client-logo-strip-title"
  >
    <div class="client-logo-strip-card">
      <div class="client-logo-strip-head">
        <h2 id="client-logo-strip-title" class="client-logo-strip-title">{{ title() }}</h2>
        <span class="client-logo-strip-toggle">
          <fm-icon-button
            size="sm"
            [icon]="toggleIcon()"
            [label]="toggleLabel()"
            [toggled]="paused()"
            (pressed)="toggle()"
          />
        </span>
      </div>
      <div class="client-logo-strip-viewport">
        <div class="client-logo-strip-track">
          <ul class="client-logo-strip-group">
            @for (item of items(); track item.key) {
              <li
                [class.is-repeat]="item.repeat"
                [attr.aria-hidden]="item.repeat || null"
                [attr.inert]="item.repeat ? '' : null"
              >
                <fm-client-logo [client]="item.client" [assetBase]="assetBase()" />
              </li>
            }
          </ul>
          <ul class="client-logo-strip-group is-copy" aria-hidden="true" inert>
            @for (item of items(); track item.key) {
              <li [class.is-repeat]="item.repeat">
                <fm-client-logo [client]="item.client" [assetBase]="assetBase()" />
              </li>
            }
          </ul>
        </div>
      </div>
    </div>
  </section>
}
