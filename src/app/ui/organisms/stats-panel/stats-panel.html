<div class="stats-panel">
  <ul class="stats-panel-counters">
    @for (counter of counters(); track counter.label) {
      <li>
        <fm-stat-counter
          [value]="counter.value"
          [suffix]="counter.suffix ?? ''"
          [label]="counter.label"
          [framed]="true"
        />
      </li>
    }
  </ul>
  @if (career().length) {
    <div class="stats-panel-career">
      <fm-career-strip [rows]="career()" [ticks]="ticks()" />
    </div>
  }
</div>
