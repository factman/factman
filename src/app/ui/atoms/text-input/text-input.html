<div [class]="classes()">
  <div class="fm-field__control field-control">
    @if (leadingIcon(); as icon) {
      <fm-icon [icon]="icon" [size]="size() === 'sm' ? 16 : 20" />
    }
    <input
      class="fm-field__input"
      [id]="inputId()"
      [type]="type()"
      [value]="value()"
      [attr.name]="name()"
      [attr.placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [attr.maxlength]="maxLength()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-describedby]="ariaDescribedby()"
      [attr.aria-invalid]="invalid() || null"
      [required]="required()"
      [disabled]="isDisabled()"
      (input)="commit($any($event.target).value)"
      (blur)="onTouched()"
    />
  </div>
</div>
