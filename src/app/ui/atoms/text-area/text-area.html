<div [class]="classes()">
  <div class="fm-field__control fm-textarea__control field-control textarea-control">
    <textarea
      class="fm-field__input fm-textarea__input textarea-input"
      [id]="controlId()"
      [rows]="rows()"
      [value]="value()"
      [attr.name]="name()"
      [attr.placeholder]="placeholder()"
      [attr.maxlength]="maxLength()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-describedby]="describedByIds()"
      [attr.aria-invalid]="isInvalid() || null"
      [required]="isRequired()"
      [disabled]="isDisabled()"
      (input)="commit($any($event.target).value)"
      (blur)="onTouched()"
    ></textarea>
  </div>
</div>
