@if (type() === 'mark') {
  <span class="fm-logo" [class]="'fm-logo--' + theme()">
    <img
      class="fm-logo__mark"
      [attr.src]="markSrc()"
      [attr.srcset]="markSrcset()"
      [attr.sizes]="size() + 'px'"
      [width]="size()"
      [height]="size()"
      [alt]="alt() ?? 'Odunayo Mohammed'"
      decoding="async"
    />
  </span>
} @else if (artwork() && type() === 'odunayo') {
  <img
    class="fm-logo fm-logo--art"
    [attr.src]="lockupSrc()"
    [attr.srcset]="lockupSrcset()"
    [attr.sizes]="lockupWidth() + 'px'"
    [width]="lockupWidth()"
    [height]="size()"
    [alt]="alt() ?? 'Odunayo'"
    decoding="async"
  />
} @else {
  <span
    class="fm-logo fm-logo--lockup"
    [class]="lockupClass()"
    [style.--fm-logo-size.px]="size()"
    role="img"
    [attr.aria-label]="label()"
  >
    <img
      class="fm-logo__mark"
      [attr.src]="markSrc()"
      [attr.srcset]="markSrcset()"
      [attr.sizes]="size() + 'px'"
      [width]="size()"
      [height]="size()"
      alt=""
      decoding="async"
    />
    <span class="fm-logo__words" aria-hidden="true">
      <!-- A space between the stacked words, so the text reads "ODUNAYO MOHAMMED" (it matches the
           link's accessible name; the flex column keeps the space invisible). -->
      @for (word of words(); track word) {
        <span class="fm-logo__word">{{ word }}</span
        >{{ $last ? '' : ' ' }}
      }
    </span>
  </span>
}
