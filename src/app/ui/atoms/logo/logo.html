@if (type() === 'mark') {
  <span class="fm-logo" [class]="'fm-logo--' + theme()">
    <img
      class="fm-logo__mark"
      [attr.src]="markSrc()"
      [attr.srcset]="markSrcset()"
      [attr.sizes]="size() + 'px'"
      [width]="size()"
      [height]="size()"
      [alt]="alt() ?? 'Odunayo Mohammed'"
      decoding="async"
    />
  </span>
} @else if (artwork()) {
  <img
    class="fm-logo fm-logo--art"
    [attr.src]="lockupSrc()"
    [attr.srcset]="lockupSrcset()"
    [attr.sizes]="lockupWidth() + 'px'"
    [width]="lockupWidth()"
    [height]="size()"
    [alt]="alt() ?? 'Odunayo'"
    decoding="async"
  />
} @else {
  <span
    class="fm-logo fm-logo--lockup"
    [class]="'fm-logo--' + theme()"
    [style.--fm-logo-size.px]="size()"
    role="img"
    [attr.aria-label]="alt() ?? 'Odunayo'"
  >
    <img
      class="fm-logo__mark"
      [attr.src]="markSrc()"
      [attr.srcset]="markSrcset()"
      [attr.sizes]="size() + 'px'"
      [width]="size()"
      [height]="size()"
      alt=""
      decoding="async"
    />
    <span class="fm-logo__words" aria-hidden="true"
      ><span class="fm-logo__word">ODUNAYO</span></span
    >
  </span>
}
