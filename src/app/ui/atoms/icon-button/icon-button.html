<fm-button
  [iconOnly]="true"
  [leadingIcon]="icon()"
  [ariaLabel]="label()"
  [variant]="variant()"
  [size]="size()"
  [href]="href()"
  [newTab]="newTab()"
  [disabled]="disabled()"
  [loading]="loading()"
  [toggled]="toggled()"
  [ariaHaspopup]="ariaHaspopup()"
  [ariaExpanded]="ariaExpanded()"
  [ariaControls]="ariaControls()"
  (pressed)="pressed.emit($event)"
/>
