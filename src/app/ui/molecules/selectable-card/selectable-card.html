<label
  class="fm-card fm-card--glass fm-selcard selcard"
  [class.is-selected]="selected()"
  [class.is-disabled]="disabled()"
  [for]="id"
>
  <input
    class="fm-selcard__input"
    [id]="id"
    [type]="type()"
    [attr.name]="name()"
    [attr.value]="value()"
    [checked]="selected()"
    [disabled]="disabled()"
    [attr.aria-labelledby]="id + '-title'"
    [attr.aria-describedby]="description() ? id + '-desc' : null"
    (change)="selectedChange.emit($any($event.target).checked)"
  />
  @if (icon(); as icon) {
    <span class="selcard-icon" aria-hidden="true"><fm-icon [icon]="icon" [size]="20" /></span>
  }
  <span class="fm-selcard__text">
    <span class="fm-selcard__title" [id]="id + '-title'">{{ title() }}</span>
    @if (description(); as description) {
      <span class="fm-selcard__desc" [id]="id + '-desc'">{{ description }}</span>
    }
  </span>
  <span
    class="fm-selcard__radio selcard-mark"
    [class.is-box]="type() === 'checkbox'"
    aria-hidden="true"
  ></span>
</label>
