<div class="fm-acc fm-acc--lg accordion">
  @for (item of items(); track item.id) {
    @let isOpen = open().includes(item.id);
    <div class="fm-acc-item fm-acc-item--card acc-item" [class.is-open]="isOpen">
      <div role="heading" [attr.aria-level]="headingLevel()">
        <button
          type="button"
          class="fm-acc-item__head"
          [id]="prefix + '-' + item.id"
          [attr.aria-expanded]="isOpen"
          (click)="toggle(item.id)"
        >
          <span class="fm-acc-item__text"
            ><span class="fm-acc-item__title">{{ item.title }}</span></span
          >
          <span class="fm-acc-item__chev"><fm-icon [icon]="chevron" [size]="20" /></span>
        </button>
      </div>
      <!-- until-found: find-in-page can reach a closed answer and opens it (beforematch). -->
      <div
        class="fm-acc-item__body acc-body"
        [id]="prefix + '-' + item.id + '-panel'"
        [attr.hidden]="isOpen ? null : 'until-found'"
        (beforematch)="reveal(item.id)"
      >
        {{ item.content }}
      </div>
    </div>
  }
</div>
