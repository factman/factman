<div
  class="fm-window"
  [class.fm-window--terminal]="variant() === 'terminal'"
  [class.is-terminal]="variant() === 'terminal'"
  [class.fm-window--glow]="glow()"
>
  <div class="fm-window__bar">
    <span class="fm-window__dots" aria-hidden="true"
      ><i></i><i class="is-min"></i><i class="is-zoom"></i
    ></span>
    <span class="fm-window__title window-title">{{ title() }}</span>
    <span class="fm-window__actions">
      <ng-content select="[windowActions]" />
      @if (closable()) {
        <fm-icon-button [icon]="close" [label]="closeLabel()" size="sm" (pressed)="closed.emit()" />
      }
    </span>
  </div>
  @if (tabs().length) {
    <div class="fm-window__tabs" aria-hidden="true">
      @for (tab of tabs(); track tab.label) {
        <span class="fm-etab window-tab" [class.is-active]="tab.active">{{ tab.label }}</span>
      }
    </div>
  }
  <div class="fm-window__body"><ng-content /></div>
</div>
