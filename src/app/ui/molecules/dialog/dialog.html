<dialog
  #dialog
  class="fm-modal dialog"
  [class.fm-modal--md]="size() === 'md'"
  [class.fm-modal--lg]="size() === 'lg'"
  [class.is-bare]="bare()"
  [attr.aria-labelledby]="bare() ? null : titleId"
  [attr.aria-label]="bare() ? label() : null"
  closedby="any"
  (cancel)="cancel($event)"
  (close)="nativeClose()"
>
  <div class="dialog-panel" [class.is-bare]="bare()">
    @if (bare()) {
      <ng-content select="[dialogBare]" />
    } @else {
      <div class="fm-modal__head">
        <div class="fm-modal__heading">
          <h2 class="fm-modal__title dialog-title" [id]="titleId">{{ label() }}</h2>
          @if (description(); as description) {
            <p class="fm-modal__desc dialog-desc">{{ description }}</p>
          }
        </div>
        <fm-icon-button [icon]="close" label="Close" size="sm" (pressed)="closed.emit()" />
      </div>
      <div class="fm-modal__body"><ng-content /></div>
      <div class="fm-modal__foot dialog-foot"><ng-content select="[dialogFooter]" /></div>
    }
  </div>
</dialog>
