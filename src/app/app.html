<!-- The page frame (MainLayout): header, the page, footer, then the fixed layers. -->
<fm-main-layout>
  <!-- The header is prerendered and hydrates once the browser is idle (or on a click, which event
       replay plays back), in its own task rather than in the bootstrap one (ETE-126). -->
  <ng-container ngProjectAs="[layoutHeader]">
    @defer (on idle; hydrate on idle) {
      <fm-site-header-host />
    } @placeholder {
      <div class="site-header-placeholder" aria-hidden="true"></div>
    }
  </ng-container>
  <main id="main" tabindex="-1">
    <router-outlet />
  </main>
  <!-- The footer (and the profile and contact data it shows) loads as it scrolls into view; the
       prerendered page has it already, so it only hydrates then (ETE-41, ETE-273). -->
  <ng-container ngProjectAs="[layoutFooter]">
    @defer (on viewport; hydrate on viewport) {
      <fm-site-footer-host />
    } @placeholder {
      <div class="site-footer-placeholder" aria-hidden="true"></div>
    }
  </ng-container>
  <!-- FR-34: the cookie consent banner, loaded only when it opens. -->
  <fm-consent-host layoutOverlays />
  @if (terminalEnabled) {
    <!-- FR-36: the terminal's chunk (and the data it reads) loads the first time it opens. -->
    @defer (when terminal.requested()) {
      <fm-terminal-host layoutOverlays />
    }
  }
</fm-main-layout>
