<fm-page-hero
  [crumbs]="crumbs"
  eyebrow="Services"
  title="Senior help for the work that matters most"
  [lead]="lead"
  [actions]="heroActions"
  [media]="photo"
/>
<section id="catalogue" class="services-catalogue" aria-labelledby="catalogue-title">
  <h2 id="catalogue-title" class="fm-sr">All services</h2>
  <fm-services-grid [services]="services" [headingLevel]="3" />
</section>
<fm-section-layout
  sectionId="process"
  eyebrow="Process"
  title="How an engagement runs"
  description="The same four steps for every service, so you always know what happens next."
>
  <fm-process-section [steps]="steps" label="How an engagement runs" />
</fm-section-layout>
<div class="services-cta">
  <fm-cta-banner
    title="Not sure which service fits?"
    text="Tell me what you're building and I'll suggest where to start, usually on a short call."
    [actions]="ctaActions"
  />
</div>
<fm-faq-section
  [items]="faq"
  description="Something else on your mind? Ask on the call, or send it by email."
/>
