<fm-profile-hero
  [profile]="profile"
  [photo]="photo"
  [socials]="socials"
  [stats]="stats"
  [timezone]="timezone"
  (openResume)="openResume()"
>
  <fm-code-editor heroEditor [files]="editorFiles" [glow]="true" [decorative]="true" />
</fm-profile-hero>
<fm-client-logo-strip [clients]="clients" />
<fm-section-layout
  sectionId="about"
  index="01"
  eyebrow="About"
  [title]="about.title"
  [description]="about.description"
>
  <fm-about-section
    [story]="profile.about"
    [photo]="aboutPhoto"
    [facts]="aboutFacts"
    [theme]="theme()"
  >
    <!-- The résumé block (ResumeSection, ETE-109) goes here, as #resume inside About. -->
    <div id="resume" class="home-resume" tabindex="-1">
      <h3>Résumé</h3>
    </div>
  </fm-about-section>
</fm-section-layout>
<fm-section-layout
  sectionId="stack"
  index="02"
  eyebrow="Stack"
  title="The tools I reach for"
  description="Grouped by area. Years are counted from the year I started using each one, so they never go stale."
>
  <fm-tech-stack [groups]="stack" />
</fm-section-layout>
<fm-section-layout
  sectionId="experience"
  index="03"
  eyebrow="Experience"
  title="Where I have worked"
  description="Current roles first, then everything else from newest to oldest. Open a role to see what I shipped and the stack behind it."
>
  <fm-experience-timeline [entries]="timeline" [glance]="glance" />
</fm-section-layout>
<fm-section-layout
  sectionId="services"
  index="04"
  eyebrow="Services"
  title="How I can help"
  [description]="servicesIntro"
>
  <fm-services-grid [services]="services" ctaLabel="Compare all services" />
</fm-section-layout>
<fm-section-layout
  sectionId="projects"
  index="05"
  eyebrow="Projects"
  title="Things I have built"
  description="Open-source tools, client platforms and side projects. Private work shows the role and stack, and you can ask for a walkthrough."
>
  <fm-project-gallery [projects]="projects" [actions]="projectLinks" (engage)="engage()" />
</fm-section-layout>
@for (section of sections; track section.id) {
  <section fmReveal [id]="section.id" [attr.aria-labelledby]="section.id + '-title'" tabindex="-1">
    <h2 [id]="section.id + '-title'">{{ section.label }}</h2>
    @if ('route' in section) {
      <p>
        <a [routerLink]="section.route">All {{ section.label.toLowerCase() }}</a>
      </p>
    }
  </section>
}
