<fm-profile-hero
  [profile]="profile"
  [photo]="photo"
  [socials]="socials"
  [stats]="stats"
  [timezone]="timezone"
  (openResume)="openResume()"
>
  <fm-code-editor heroEditor [files]="editorFiles" [glow]="true" [decorative]="true" />
</fm-profile-hero>
@for (section of sections; track section.id) {
  <section fmReveal [id]="section.id" [attr.aria-labelledby]="section.id + '-title'" tabindex="-1">
    <h2 [id]="section.id + '-title'">{{ section.label }}</h2>
    @if ('route' in section) {
      <p>
        <a [routerLink]="section.route">All {{ section.label.toLowerCase() }}</a>
      </p>
    }
  </section>
}
