<fm-page-hero
  [crumbs]="crumbs"
  eyebrow="Blog"
  title="Building software, and the teams behind it"
  lead="Hands-on articles on architecture, payments, cloud, mobile and engineering leadership, taken from the projects I ship. Newest first; filter by topic, and each post opens on Medium."
  [actions]="actions"
  [flush]="true"
/>
<section class="blog-all" aria-labelledby="blog-all-title">
  <h2 id="blog-all-title" class="fm-sr">All articles</h2>
  <fm-blog-feed
    [posts]="blog.posts()"
    [status]="blog.status()"
    [profileUrl]="blog.profileUrl"
    [filterable]="true"
    (retry)="blog.retry()"
  />
</section>
