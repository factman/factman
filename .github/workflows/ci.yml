name: CI

# Every pull request, and every push to dev (integration) or main.
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  # actions: read lets Nx Cloud Self-Healing CI read the job logs.
  actions: read
  contents: read

env:
  CI: true
  # Nx Cloud remote cache (nxCloudId in nx.json). The token is optional when the
  # workspace's GitHub integration grants CI access.
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  # Stage 1: validate data, then lint, typecheck, format
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate data (gate)
        run: pnpm data:validate
      - name: Format, lint, typecheck and header check (vercel.json)
        run: pnpm nx run-many -t format:check lint typecheck test:headers test:reports
      # Nx Cloud Self-Healing CI: when an Nx task above fails, Nx Cloud analyses it and proposes a fix on the PR.
      - name: Nx Cloud Self-Healing CI
        if: always()
        run: pnpm nx fix-ci

  # Stage 3: unit and Storybook (axe) tests
  test:
    name: Unit and Storybook tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:scripts
      # Unit and Storybook (axe) tests, with coverage merged into coverage/ (ETE-237).
      - run: pnpm test:coverage
      # Deployed at /coverage on the preview for this commit (job preview below).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7
      # Nx Cloud Self-Healing CI: when an Nx task above fails, Nx Cloud analyses it and proposes a fix on the PR.
      - name: Nx Cloud Self-Healing CI
        if: always()
        run: pnpm nx fix-ci

  # Stage 4: prerendered build
  build:
    name: Build (prerender)
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Production (www.factman.dev) builds without Storybook; previews ship it at /storybook (ETE-236).
      - run: pnpm build
      - name: Check the home route was prerendered
        run: grep -q '<h1>Odunayo Mohammed</h1>' dist/factman/browser/index.html
      - name: Check the production build (no Storybook, bundle contents, CSP hashes)
        run: pnpm test:build-production
      - name: Build the preview variant (preview settings, Storybook at /storybook)
        run: pnpm build:preview
      - name: Check the preview build (Storybook, bundle contents, CSP hashes)
        run: pnpm test:build
      # The preview build: visual regression screenshots its Storybook.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/factman/browser
          retention-days: 7
      # Nx Cloud Self-Healing CI: when an Nx task above fails, Nx Cloud analyses it and proposes a fix on the PR.
      - name: Nx Cloud Self-Healing CI
        if: always()
        run: pnpm nx fix-ci

  # Stage 5: visual regression of the UI kit (ETE-84), Light and Dark, against Linux baselines in
  # vr/__screenshots__. The new screenshots are always uploaded: a run without baselines (or with
  # an intended change) produces them for review (docs/visual-regression.md).
  vr:
    name: Visual regression
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/factman/browser
      - name: Compare screenshots
        run: pnpm exec playwright test -c playwright.vr.config.ts
      - name: Collect the screenshots this run took
        if: always()
        run: |
          mkdir -p vr-actual
          find test-results -name '*-actual.png' -exec cp {} vr-actual/ \; 2>/dev/null || true
          find vr/__screenshots__ -newer playwright.vr.config.ts -name '*.png' -exec cp {} vr-actual/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vr-screenshots
          path: |
            vr-actual
            vr-report
          retention-days: 7

  # Stage 5 (local half): E2E against the built static files.
  # Preview deploy + E2E against the Vercel preview waits on ETE-21.
  e2e:
    name: E2E (Playwright)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
      # Nx restores the build job's output from the Nx Cloud remote cache: the preview build for
      # the five-browser suite, then the production build for its own checks (ETE-236).
      - run: pnpm e2e
      - run: pnpm e2e:production
        if: success() || failure()
      # One HTML report from both runs' blobs, deployed at /playwright on the preview (ETE-237).
      - name: Merge the Playwright reports
        if: always()
        run: pnpm e2e:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # Nx Cloud Self-Healing CI: when an Nx task above fails, Nx Cloud analyses it and proposes a fix on the PR.
      - name: Nx Cloud Self-Healing CI
        if: always()
        run: pnpm nx fix-ci

  # Stage 6: preview deployment (ETE-237). Vercel builds production (main) itself; every other
  # deployment is this job's: the preview build from the build job, with the coverage and
  # Playwright reports of this commit at /coverage and /playwright. It runs whenever the build
  # passed, so a failing test run's reports are still there to read. dev deploys are also served at
  # factman.vercel.app. Fork pull requests get no secrets, so no preview.
  preview:
    name: Preview deployment
    # Every job, so the pull request comment can report them all (ETE-240).
    needs: [static, test, build, vr, e2e]
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'push' && github.ref == 'refs/heads/dev' ||
       github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The workflow's read-only permissions, plus writing the preview comment on the pull request.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_hQYHjWOcb6HSZi19HFTXELDh
      VERCEL_PROJECT_ID: prj_RsnaeoxFwzcHeyM2N99nAxowJ2ot
      VERCEL_CLI: vercel@65.11.0
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/factman/browser
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage
          path: coverage
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report
      - name: Add the reports to the preview build
        run: node tools/reports/add-reports.mjs
      - name: Check the preview output (Storybook, reports, CSP hashes)
        run: node --test --test-reporter=spec "tools/build/*.test.mjs"
        env:
          BUILD_VARIANT: preview
          REPORTS: required
      - name: Open each report under its CSP
        run: pnpm exec playwright test
        env:
          E2E_VARIANT: reports
      - name: Check the Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::The VERCEL_TOKEN secret is not set, so this preview cannot deploy. See docs/test-reports.md."
            exit 1
          fi
      - name: Build the Vercel output from the prebuilt site
        run: |
          pnpm dlx "$VERCEL_CLI" pull --yes --environment=preview --token="$VERCEL_TOKEN"
          FM_PREBUILT=1 pnpm dlx "$VERCEL_CLI" build --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          url=$(pnpm dlx "$VERCEL_CLI" deploy --prebuilt --token="$VERCEL_TOKEN" \
            --meta githubCommitRef="$BRANCH" --meta githubCommitSha="$GITHUB_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview deployment"
            echo ""
            echo "- Site: $url"
            echo "- Storybook: $url/storybook"
            echo "- Coverage: $url/coverage"
            echo "- Playwright report: $url/playwright"
          } >> "$GITHUB_STEP_SUMMARY"
      # Through the REST API with the team ID: the CLI's alias command looks up a user account,
      # which a team token does not have.
      - name: Serve dev at factman.vercel.app
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          api() { curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' "$@"; }
          id=$(api "https://api.vercel.com/v13/deployments/${URL#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          api -X POST -d '{"alias":"factman.vercel.app"}' \
            "https://api.vercel.com/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID" | jq -r '"aliased " + .alias'
      # One comment per pull request, updated in place on every push (ETE-240). It is public, so it
      # holds links, job results and coverage only: tools/reports/preview-comment.mjs.
      - name: Comment the preview on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RESULT_STATIC: ${{ needs.static.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_VR: ${{ needs.vr.result }}
          RESULT_E2E: ${{ needs.e2e.result }}
        run: |
          body="$RUNNER_TEMP/preview-comment.md"
          node tools/reports/preview-comment.mjs > "$body"
          marker='<!-- fm-preview-deployment -->'
          id=$(gh api "repos/$REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" |
            head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$id" -F "body=@$body" > /dev/null
            echo "Updated the preview comment ($id)"
          else
            gh pr comment "$PR" --repo "$REPOSITORY" --body-file "$body"
          fi
