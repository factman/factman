name: CI

# Every pull request, and every push to dev (integration) or main.
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  # Nx Cloud remote cache (nxCloudId in nx.json). The token is optional when the
  # workspace's GitHub integration grants CI access.
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  # Stage 1: validate data, then lint, typecheck, format
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate data (gate)
        run: pnpm data:validate
      - name: Format, lint, typecheck and header check (vercel.json)
        run: pnpm nx run-many -t format:check lint typecheck test:headers

  # Stage 3: unit and Storybook (axe) tests
  test:
    name: Unit and Storybook tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:scripts
      - run: pnpm test --watch=false
      - run: pnpm test:storybook

  # Stage 4: prerendered build
  build:
    name: Build (prerender)
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check the home route was prerendered
        run: grep -q '<h1>Odunayo Mohammed</h1>' dist/factman/browser/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/factman/browser
          retention-days: 7

  # Stage 5 (local half): E2E against the built static files.
  # Preview deploy + E2E against the Vercel preview waits on ETE-21.
  e2e:
    name: E2E (Playwright)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
      # Nx restores the build job's output from the Nx Cloud remote cache.
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
